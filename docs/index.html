<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行攻略</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --red: #8B2F1B;
      --red-light: #a54326;
      --gold: #C9A227;
      --cream: #F7F1E3;
      --card: #FFFFFF;
      --text: #3B2E24;
      --muted: #8a7a68;
      --line: #E5DCCB;
      --shadow: 0 8px 30px rgba(80,50,30,.12);
    }

    @font-face {
      font-family: 'MaShanZheng';
      src: url('fonts/MaShanZheng-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }

    /* ===== 封面区 ===== */
    .cover {
      position: relative;
      height: 42vh;
      min-height: 280px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
    }
    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,10,8,.05) 0%, rgba(20,10,8,.35) 60%, rgba(20,10,8,.78) 100%);
    }
    .cover-inner {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 24px 46px;
      color: #fff;
    }
    .cover h1 {
      font-family: 'MaShanZheng', 'Kaiti SC', 'STKaiti', 'KaiTi', cursive;
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 400;
      letter-spacing: 6px;
      text-shadow: 0 2px 16px rgba(0,0,0,.5);
    }
    .cover p {
      margin-top: 12px;
      font-size: 15px;
      opacity: .92;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
      letter-spacing: 1px;
    }

    /* ===== 主体 ===== */
    .main {
      max-width: 1000px;
      margin: -24px auto 0;
      padding: 0 24px 80px;
      position: relative;
      z-index: 3;
    }

    /* 搜索框 */
    .search-bar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar .icon {
      font-size: 18px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      padding: 8px 0;
    }
    .search-input::placeholder { color: var(--muted); }

    /* 标签筛选条 */
    .tags-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .2s ease;
      font-family: inherit;
    }
    .chip:hover {
      border-color: var(--gold);
      color: var(--red);
    }
    .chip.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* 卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(80,50,30,.18);
    }
    .card .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-light) 55%, var(--gold) 130%);
    }
    .card .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .3s ease;
    }
    .card:hover .thumb img { transform: scale(1.05); }
    .card .thumb .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      opacity: .75;
    }
    .card .thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(20,10,8,.72) 100%);
    }
    .card .title {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 40px 16px 13px;
      color: #fff;
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.45;
      text-shadow: 0 1px 8px rgba(0,0,0,.4);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 空状态 */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      display: none;
    }
    .empty.show { display: block; }
    .empty .e-icon { font-size: 44px; display: block; margin-bottom: 12px; }
    .empty .hint { font-size: 13px; margin-top: 6px; opacity: .8; }

    /* 统计 */
    .count-line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    footer {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      padding: 8px 24px 36px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      .cover { height: 34vh; min-height: 220px; }
      .grid { grid-template-columns: 1fr; }
      .card .thumb { aspect-ratio: 16 / 9; }
    }
  </style>
</head>
<body>
  <div class="cover">
    <img src="images/kailash2.jpg" alt="旅行攻略封面" loading="eager">
    <div class="cover-inner">
      <h1>旅行攻略</h1>
      <p>山高路远，看世界，也找自己</p>
    </div>
  </div>

  <div class="main">
    <div class="search-bar">
      <span class="icon">&#128269;</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索目的地、天数、主题…">
    </div>
    <div class="tags-bar" id="tagsBar"></div>
    <div class="count-line" id="countLine"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <span class="e-icon">&#127757;</span>
      <div>没有找到匹配的攻略</div>
      <div class="hint">换个关键词或清除筛选试试</div>
    </div>
  </div>

  <footer>旅行攻略 · 持续更新中</footer>

  <script>
    (function () {
      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty');
      var tagsBar = document.getElementById('tagsBar');
      var countLine = document.getElementById('countLine');
      var searchInput = document.getElementById('searchInput');

      var guides = [];
      var activeTags = [];

      function getEl(id) { return document.getElementById(id); }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function buildCard(g) {
        var card = el('a', 'card');
        card.href = g.html;

        var thumb = el('div', 'thumb');
        if (g.cover) {
          var img = document.createElement('img');
          img.src = g.cover;
          img.alt = g.title || '';
          img.loading = 'lazy';
          img.onerror = function () {
            var ph = el('div', 'ph', '\uD83C\uDFD4');
            thumb.insertBefore(ph, thumb.firstChild);
            img.remove();
          };
          thumb.appendChild(img);
        } else {
          thumb.appendChild(el('div', 'ph', '\uD83C\uDFD4'));
        }

        card.appendChild(thumb);
        card.appendChild(el('div', 'title', g.title));
        return card;
      }

      function collectTags() {
        var map = {};
        guides.forEach(function (g) {
          (g.tags || []).forEach(function (t) {
            if (!map[t]) map[t] = 0;
            map[t]++;
          });
        });
        return Object.keys(map).sort(function (a, b) {
          return map[b] - map[a] || a.localeCompare(b, 'zh');
        });
      }

      function buildTags() {
        tagsBar.innerHTML = '';
        collectTags().forEach(function (t) {
          var c = el('button', 'chip' + (activeTags.indexOf(t) !== -1 ? ' active' : ''), t);
          c.addEventListener('click', function () {
            var i = activeTags.indexOf(t);
            if (i !== -1) activeTags.splice(i, 1);
            else activeTags.push(t);
            render();
          });
          tagsBar.appendChild(c);
        });
      }

      function matches(g) {
        var q = searchInput.value.trim().toLowerCase();
        if (q) {
          var haystack = [g.title, g.summary || '', g.destination || '']
            .concat(g.tags || []).join(' ').toLowerCase();
          if (haystack.indexOf(q) === -1) return false;
        }
        if (activeTags.length) {
          var has = activeTags.every(function (t) { return (g.tags || []).indexOf(t) !== -1; });
          if (!has) return false;
        }
        return true;
      }

      function render() {
        var hits = guides.filter(matches);
        grid.innerHTML = '';
        hits.forEach(function (g) { grid.appendChild(buildCard(g)); });
        empty.classList.toggle('show', hits.length === 0);
        var base = activeTags.length ? '已筛选 ' : '';
        var q = searchInput.value.trim();
        countLine.textContent = base + hits.length + ' / ' + guides.length + ' 篇攻略';
      }

      searchInput.addEventListener('input', render);

      fetch('guides.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          guides = Array.isArray(data) ? data : [];
          buildTags();
          render();
        })
        .catch(function () {
          grid.innerHTML = '';
          empty.classList.add('show');
          empty.querySelector('.hint').textContent = '攻略数据加载失败，请刷新页面重试';
        });
    })();
  </script>
</body>
</html>
